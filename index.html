<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hope</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #05060a;
      overflow: hidden;
      font-family: "Segoe UI", "SF Pro Display", system-ui, sans-serif;
      color: #e8f6ff;
      user-select: none;
      transition: background 0.8s ease;
    }
    canvas#net { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
    .idle-wash {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(circle at 50% 48%, rgba(255, 140, 50, 0.28), rgba(18, 6, 0, 0.62) 70%);
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    body.asleep { background: #160a03; }
    body.asleep .idle-wash { opacity: 1; }
    .ui { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: grid; place-items: center; }
    .chat {
      width: min(420px, 86vw); height: min(520px, 70vh);
      pointer-events: auto; display: flex; flex-direction: column;
      border-radius: 22px; background: rgba(8, 14, 26, 0.82);
      border: 1px solid rgba(120, 200, 255, 0.28);
      box-shadow: 0 0 40px rgba(40, 140, 255, 0.18), inset 0 0 40px rgba(30, 80, 160, 0.12);
      backdrop-filter: blur(14px); opacity: 0; transform: scale(0.82);
      transition: opacity 0.35s ease, transform 0.35s ease; overflow: hidden;
      user-select: text;
    }
    .chat.on { opacity: 1; transform: scale(1); }
    .chat header {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      border-bottom: 1px solid rgba(120, 200, 255, 0.15);
      font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #bfe9ff;
    }
    .chat header button {
      margin-left: auto; background: transparent; border: 1px solid rgba(140, 210, 255, 0.3);
      color: #d7f3ff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 11px;
    }
    .msgs { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; pointer-events: auto; }
    .line, .chat-bubble, .bubble {
      max-width: 100%; background: none; border: 0; border-radius: 0; padding: 0;
      font-size: 14px; line-height: 1.55; user-select: text; pointer-events: auto;
      position: relative; z-index: 2; white-space: pre-wrap; word-break: break-word;
    }
    .line.bot, .chat-bubble:not(.user), .bubble.bot { align-self: stretch; color: #d7f3ff; }
    .line.me, .chat-bubble.user, .bubble.me { align-self: stretch; color: #8fd0ea; text-align: right; }
    .chat-bubble a, .bubble a, .line a {
      color: #79d2ff !important; text-decoration: underline !important;
      cursor: pointer !important; pointer-events: auto !important;
      position: relative; z-index: 20; word-break: break-all;
    }
    .chat-bubble img, .line img { max-width: 180px; border-radius: 10px; display: block; margin-top: 6px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(120, 200, 255, 0.15); align-items: flex-end; }
    form textarea, form input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(140, 210, 255, 0.25);
      color: #eef9ff; border-radius: 12px; padding: 10px 12px; outline: none; font-size: 14px;
      font-family: inherit; resize: none; max-height: 120px;
    }
    form button { background: #79d2ff; color: #041018; border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
    .preview-row { display: none; padding: 0 12px 8px; align-items: center; gap: 8px; }
    .preview-row.on { display: flex; }
    .preview-row img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
    .preview-row button { background: transparent; border: 1px solid rgba(140,210,255,.3); color: #d7f3ff; border-radius: 999px; padding: 2px 8px; cursor: pointer; }
    .dock { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; display: flex; gap: 10px; pointer-events: auto; transition: opacity 0.45s ease, transform 0.45s ease; }
    .dock.hide { opacity: 0; pointer-events: none; transform: translate(-50%, 10px); }
    .d3wrapper { position: relative; width: 38px; height: 34px; transform-style: preserve-3d; perspective: 80px; display: flex; align-items: center; justify-content: center; }
    .d3wrapper .cover { background: #05070e; height: 34px; width: 38px; border-radius: 7px; transform: rotateX(13deg); position: absolute; z-index: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 5px; box-shadow: 0 1px 1px 1px rgba(150, 220, 255, 0.35); transition: background 0.6s ease, box-shadow 0.6s ease; }
    .d3wrapper .button { cursor: pointer; border: none; border-bottom: 1px solid rgba(180, 230, 255, 0.55); background: linear-gradient(180deg, #1a2a3d 0%, #0c1522 100%); box-shadow: 0 3px 0 0.2px #061018; height: 30px; width: 34px; border-radius: 6px; transform: rotateX(13deg); z-index: 2; position: absolute; transition: background 0.6s ease, color 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease, transform 80ms; color: #bfe9ff; display: grid; place-items: center; }
    .d3wrapper .button:active, .d3wrapper .button.on { box-shadow: 0 3px 0 0.2px transparent; transform: translateY(3px) rotateX(13deg); color: #e8f7ff; }
    .d3wrapper svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .player, .browse-panel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px); z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; }
    .player.on, .browse-panel.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .player.hide, .browse-panel.hide { opacity: 0; pointer-events: none; }
    .card { position: relative; width: 260px; height: 130px; background: #0b1018; border: 1px solid rgba(120, 200, 255, 0.18); border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    .browse-panel .card { width: min(360px, 90vw); height: auto; min-height: 180px; }
    .browse-panel img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; display: none; background: #000; }
    .browse-panel img.on { display: block; }
    .browse-panel .blog { font-size: 11px; color: #9bb4c8; margin-top: 8px; max-height: 70px; overflow: auto; }
    .card .top { display: flex; gap: 10px; }
    .card .pfp { height: 40px; width: 40px; background: #1a2433; border-radius: 5px; display: flex; justify-content: center; align-items: center; flex: 0 0 40px; }
    .card .title-1 { color: #e8f6ff; font-size: 16px; font-weight: 800; margin-left: 5px; }
    .card .title-2 { color: #9bb4c8; font-size: 11px; font-weight: 700; margin-top: 2px; margin-left: 5px; }
    .card .time { width: 90%; background: #2a3544; height: 6px; border-radius: 3px; position: absolute; left: 5%; bottom: 21px; }
    .card .elapsed { width: 42%; background: #79d2ff; height: 100%; border-radius: 3px; }
    .card .controls { color: #e8f6ff; display: flex; position: absolute; bottom: 30px; left: 0; width: 100%; justify-content: center; align-items: center; }
    .card .volume { height: 100%; width: 50px; margin-right: 2px; opacity: 0; position: relative; transition: 0.2s; }
    .card .air { height: 100%; width: 54px; }
    .card .controls svg { cursor: pointer; margin-bottom: 5px; }
    .card .controls svg:hover { color: #79d2ff; }
    .card .volume .slider { height: 4px; background: #2a3544; width: 80%; border-radius: 2px; margin-top: 8px; margin-left: 10%; }
    .card .volume .slider .green { background: #79d2ff; height: 100%; width: 80%; border-radius: 3px; }
    .card .volume .circle { background: #fff; height: 6px; width: 6px; border-radius: 3px; position: absolute; right: 20%; top: 60%; }
    .card .volume_button:hover ~ .volume { opacity: 1; }
    .card .timetext { color: #cfe8f6; font-size: 8px; position: absolute; }
    .card .time_now { bottom: 8px; left: 15px; }
    .card .time_full { bottom: 8px; right: 14px; }
    .card .close-player, .settings .close-player { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; color: #9bb4c8; cursor: pointer; font-size: 14px; }
    .playing { display: flex; justify-content: center; gap: 1px; width: 30px; height: 20px; }
    .greenline { background: #79d2ff; height: 20px; width: 2px; transform-origin: bottom; }
    .line-1 { animation: playing 1s ease-in-out infinite; animation-delay: .2s; }
    .line-2 { animation: playing 1s ease-in-out infinite; animation-delay: .5s; }
    .line-3 { animation: playing 1s ease-in-out infinite; animation-delay: .6s; }
    .line-4 { animation: playing 1s ease-in-out infinite; }
    .line-5 { animation: playing 1s ease-in-out infinite; animation-delay: .4s; }
    @keyframes playing { 0%,100% { transform: scaleY(0.1); } 33% { transform: scaleY(0.6); } 66% { transform: scaleY(0.9); } }
    .settings { position: fixed; right: 18px; bottom: 70px; z-index: 8; width: 230px; padding: 12px 14px; border-radius: 14px; background: rgba(8, 14, 24, 0.88); border: 1px solid rgba(120, 200, 255, 0.22); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 0.3s ease, transform 0.3s ease; }
    .settings.on { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .settings h3 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #bfe9ff; margin-bottom: 10px; }
    .settings label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #d7eef8; padding: 6px 0; }
    .settings input { accent-color: #79d2ff; }
    .pulsebar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6; width: min(720px, 86vw); height: 56px; pointer-events: none; opacity: 0.9; transition: opacity 0.35s ease; }
    .pulsebar.hide { opacity: 0; }
    .pulsebar svg { width: 100%; height: 100%; overflow: hidden; }
    .pulsebar .track { fill: none; stroke: #79d2ff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(121,210,255,0.45)); transition: stroke 0.6s ease; }
    .pulsebar .dots { fill: #79d2ff; transition: fill 0.6s ease; }
    .pulsebar .flat { opacity: 1; transition: opacity 0.2s ease; }
    .pulsebar .wave { opacity: 0; transition: opacity 0.2s ease; }
    .pulsebar.talk .flat { opacity: 0; }
    .pulsebar.talk .wave { opacity: 1; }
    .pulsebar.talk .track { stroke: #c4f1ff; stroke-width: 2.6; }
    .pulsebar .scroll { animation: none; }
    .pulsebar.talk .scroll { animation: pulseTalk 1.2s linear infinite; }
    @keyframes pulseTalk { from { transform: translateX(0); } to { transform: translateX(-400px); } }
    .status { position: fixed; top: 16px; left: 16px; z-index: 8; pointer-events: none; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #bfe9ff; transition: color 0.6s ease; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ad0ff; box-shadow: 0 0 8px rgba(74,208,255,0.9); animation: liveDot 1.6s ease-in-out infinite; }
    .status .state { letter-spacing: 0.12em; color: #8fd8ff; font-size: 10px; }
    body.asleep .status { color: #ffd8b0; }
    body.asleep .status .dot { background: #ff8a3a; box-shadow: 0 0 10px rgba(255,138,58,0.95); }
    body.asleep .status .state { color: #ffb06a; }
    body.asleep .pulsebar .track, body.asleep .pulsebar .dots { stroke: #ff9a4a; fill: #ff9a4a; }
    body.asleep .d3wrapper .cover {
      background: #140804;
      box-shadow: 0 1px 1px 1px rgba(255, 150, 70, 0.45);
    }
    body.asleep .d3wrapper .button {
      background: linear-gradient(180deg, #3a2212 0%, #1a0c04 100%);
      border-bottom: 1px solid rgba(255, 170, 90, 0.6);
      box-shadow: 0 3px 0 0.2px #0c0602;
      color: #ffc48a;
    }
    body.asleep .d3wrapper .button:active,
    body.asleep .d3wrapper .button.on { color: #ffe0c0; }
    body.listening .status .dot { background: #4aff9a; box-shadow: 0 0 10px rgba(74,255,154,0.95); }
    body.listening .status .state { color: #8fffc4; }
    #btnMic.listening { color: #4aff9a !important; box-shadow: 0 0 12px rgba(74,255,154,0.65); }
    #btnMic.listening svg { animation: micPulse 1s ease-in-out infinite; }
    @keyframes micPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } }
    @keyframes liveDot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.72); opacity: 0.7; } }
    .hand-preview {
      position: fixed; right: 16px; top: 16px; z-index: 9;
      width: 180px; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(120,200,255,0.28);
      background: #000; display: none; pointer-events: none;
    }
    .hand-preview.on { display: block; }
    .hand-preview video, .hand-preview canvas { width: 100%; height: 135px; object-fit: cover; display: block; }
    .hand-preview canvas { position: absolute; inset: 0; }
    .hand-preview .wrap { position: relative; }
    .hand-preview .tag {
      position: absolute; left: 8px; bottom: 6px; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase; color: #bfe9ff;
    }
    #handCursor {
      position: fixed; z-index: 40; width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border-radius: 50%; pointer-events: none; opacity: 0;
      border: 2px solid #79d2ff;
      box-shadow: 0 0 14px rgba(121,210,255,0.75), inset 0 0 8px rgba(121,210,255,0.35);
      transition: opacity 0.18s ease, background 0.15s ease, border-color 0.15s ease;
    }
    #handCursor.on { opacity: 1; }
    #handCursor.click {
      transform: scale(0.72);
      background: rgba(121,210,255,0.55);
      border-color: #e8f6ff;
    }
    #handCursor.pinch {
      background: rgba(255,160,80,0.45);
      border-color: #ffb06a;
    }
    @media (max-width: 720px) { .dock, .player, .browse-panel { bottom: 16px; } .pulsebar { top: 10px; height: 44px; } }
  </style>
</head>

  <script>
    window.BACKEND_URL = window.BACKEND_URL || "https://hope-production-7e9d.up.railway.app";
    window.HOPE_BROWSE_MODE = false;
    window.CONCISE_MODE = true;
  </script>
  <script>
  (function () {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const WAKE = /\b((hey|hi|yo|ok|okay|oh)\s+)?(hope|hoped|hopes)\b/i;
    let wakeRec = null, talkRec = null, wakeOn = true, talkOn = false;
    let restartingWake = false, restartingTalk = false, lastWakeAt = 0, micReady = false;
    function normHeard(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
    }
    function isEcho(text) {
      if (window.hopeIsSpeaking) return true;
      if (Date.now() < (window.hopeIgnoreUntil || 0)) return true;
      const a = normHeard(text);
      const b = normHeard(window.lastHopeSpoken || "");
      if (!a) return true;
      if (b && (a === b || (a.length > 12 && b.includes(a)) || (b.length > 12 && a.includes(b.slice(0, Math.min(48, b.length)))))) return true;
      return false;
    }
    function paint() {
      window.hopeListenLabel = talkOn ? "listening" : "";
      document.body.classList.toggle("listening", talkOn);
      const btn = document.getElementById("btnMic");
      if (btn) { btn.classList.toggle("on", talkOn); btn.classList.toggle("listening", talkOn); }
    }
    async function ensureMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        stream.getTracks().forEach((t) => t.stop());
        micReady = true;
        return true;
      } catch (_) {
        const state = document.getElementById("statusState");
        if (state) state.textContent = "mic blocked";
        return false;
      }
    }
    function cleanHeard(text) {
      return String(text || "").replace(/^(hey|hi|yo|ok|okay|oh)[,.\s]+/i, "").replace(/^(hope|hoped|hopes)[,.\s]*/i, "").trim();
    }
    async function sendHeard(raw) {
      if (window.hopeIsSpeaking) return;
      const text = String(raw || "").trim();
      if (!text || isEcho(text) || /welcome back|i'm ready when you are/i.test(text)) return;
      if (window.pokeActivity) window.pokeActivity();
      if (window.sendToHope) await window.sendToHope(text);
    }
    function makeRec() {

    async function sendToHope(text) {
      const msg = String(text || "").trim();
      if (!msg && !pendingImage) return;
      poke();
      if (/\b(close|stop|turn off)\b.*\bbrowser\b|\bbrowser\b.*\b(off|close|stop)\b/i.test(msg)) setBrowse(false);
      else if (looksLikeBrowse(msg)) setBrowse(true);
      addLine(msg || "[image]", "me");
      S.mode = "talking";
      let reply = "No response.";
      try {
        const res = await fetch(`${window.BACKEND_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg || "[image]",
            concise: !!(document.getElementById("setConcise") && document.getElementById("setConcise").checked),
            browse_mode: !!(window.HOPE_BROWSE_MODE),
            image: pendingImage || null
          })
        });
        const data = await res.json();
        reply = data.reply || data.liveweb_analyzed || "No response.";
      } catch (_) { reply = "Could not reach Hope."; }
      clearImage();
      addLine(reply, "bot");
      if (!/welcome back/i.test(reply)) await speakText(reply);
      S.mode = "idle";
    }
    window.sendToHope = sendToHope;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text && !pendingImage) return;
      input.value = "";
      flyIn();
      await sendToHope(text || "[image]");
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    function looksLikeBrowse(text) {
      return /\b(open (the )?browser|turn on (the )?browser|browse|go to|visit|open (https?:\/\/|www\.)|look up|google|youtube|search (for|the web)|navigate to)\b/i.test(String(text || ""));
    }
    function frameSrc(img) {
      if (!img) return "";
      return String(img).startsWith("data:") ? img : ("data:image/png;base64," + img);
    }
    function setBrowse(on) {
      on = !!on;
      document.getElementById("search").checked = on;
      window.HOPE_BROWSE_MODE = on;
      document.getElementById("btnBrowser").classList.toggle("on", on);
      S.browse = on;
      poke();
      if (!on) {
        document.getElementById("browseImg").classList.remove("on");
        document.getElementById("browseImg").removeAttribute("src");
        document.getElementById("browseLog").textContent = "Browser off. Say “Hope, open the browser and go to …” or tap the globe.";
      } else {
        document.getElementById("browseLog").textContent = "Browser on. Tell Hope where to go.";
      }
    }
    document.getElementById("btnBrowser").addEventListener("click", (e) => { e.stopPropagation(); setBrowse(!document.getElementById("search").checked); });
    document.getElementById("search").addEventListener("change", (e) => setBrowse(e.target.checked));
    document.getElementById("closeBrowse").addEventListener("click", async (e) => { e.stopPropagation(); setBrowse(false); try { await fetch(`${window.BACKEND_URL}/browse-stop`, { method: "POST" }); } catch (_) {} });
    setInterval(async () => {
      if (!window.HOPE_BROWSE_MODE) return;
      try {
        const res = await fetch(`${window.BACKEND_URL}/browse-frame`);
        const data = await res.json();
        const img = document.getElementById("browseImg");
        if (data.image) { img.src = frameSrc(data.image); img.classList.add("on"); }
        if (data.log || data.url) document.getElementById("browseLog").textContent = data.log || data.url;
      } catch (_) {}
    }, 1200);
    document.getElementById("btnMic").addEventListener("click", (e) => { e.stopPropagation(); poke(); if (window.toggleMic) window.toggleMic(); });
    document.getElementById("btnMusic").addEventListener("click", (e) => { e.stopPropagation(); poke(); S.music = true; });
    document.getElementById("closePlayer").addEventListener("click", (e) => { e.stopPropagation(); poke(); S.music = false; });
    document.getElementById("btnChat").addEventListener("click", (e) => { e.stopPropagation(); flyIn(); });
    document.getElementById("btnSettings").addEventListener("click", (e) => { e.stopPropagation(); poke(); e.currentTarget.classList.toggle("on"); settingsEl.classList.toggle("on"); });
    document.getElementById("setHope").addEventListener("change", (e) => { S.hopeOn = e.target.checked; if (!S.hopeOn && S.form !== "orb") setForm("orb"); });
    document.getElementById("setTalk").addEventListener("change", (e) => { S.mode = e.target.checked ? "talking" : "idle"; });
    document.getElementById("setWake").addEventListener("change", (e) => { if (e.target.checked && window.startWakeWordMode) window.startWakeWordMode(); else if (window.stopWakeWordMode) window.stopWakeWordMode(); });
    document.getElementById("closeSettings").addEventListener("click", (e) => { e.stopPropagation(); settingsEl.classList.remove("on"); document.getElementById("btnSettings").classList.remove("on"); });
    async function playWelcome() {
      if (welcomePlayed) return;
      welcomePlayed = true;
      poke();
      if (window.ensureMic) await window.ensureMic();
      let reply = "I'm ready when you are.";
      try { const res = await fetch(`${window.BACKEND_URL}/welcome`); if (res.ok) { const data = await res.json(); reply = data.reply || reply; } } catch (_) {}
      addLine(reply, "bot");
      await speakText(reply);
    }
    document.body.addEventListener("click", playWelcome, { once: true });
    document.body.addEventListener("touchstart", playWelcome, { once: true });
    window.NeuralOrb = { talk(text) { poke(); S.mode = "talking"; speakText(text); }, idle() { S.mode = "idle"; }, enter: flyIn, exit: flyOut };

    (function () {
      const preview = document.getElementById("handPreview");
      const video = document.getElementById("handCam");
      const overlay = document.getElementById("handOverlay");
      const tag = document.getElementById("handTag");
      const toggle = document.getElementById("setHands");
      const cursorEl = document.getElementById("handCursor");
      const octx = overlay.getContext("2d");
      let landmarker = null, camStream = null, running = false, lastVideoTime = -1;
      let lastCommandAt = 0, lastClickAt = 0, lastModeAt = 0;
      let mode = "none";
      let enterFrames = 0;
      let cursorX = innerWidth / 2, cursorY = innerHeight / 2;
      let pinchHeld = false;
      let pinchOpen = true;
      let pinchFrames = 0;
      const ENTER = { palm: 7, fist: 7, point: 5, none: 5 };
      const HOLD = { palm: 10, fist: 10, point: 14 };
      const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
      function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function ext(lm, tip, mcp) {
        return dist(lm[tip], lm[0]) / Math.max(dist(lm[mcp], lm[0]), 0.02);
      }
      function fingerOpen(lm, tip, pip, mcp, scale) {
        return dist(lm[tip], lm[mcp]) > dist(lm[pip], lm[mcp]) * 1.12 && dist(lm[tip], lm[mcp]) > scale * 0.68;
      }
      function isPoint(lm, scale) {
        const i = ext(lm, 8, 5);
        const m = ext(lm, 12, 9);
        const r = ext(lm, 16, 13);
        const p = ext(lm, 20, 17);
        const indexStraight = dist(lm[8], lm[5]) > scale * 0.58;
        const indexDominant = i > 1.32 && i > m * 1.10 && i > r * 1.08 && i > p * 1.06;
        const othersFolded = [m, r, p].filter((v) => v < 1.45).length >= 2;
        return indexStraight && indexDominant && othersFolded;
      }
      function classify(lm) {
        const scale = Math.max(dist(lm[0], lm[9]), 0.08);
        const index = fingerOpen(lm, 8, 6, 5, scale);
        const middle = fingerOpen(lm, 12, 10, 9, scale);
        const ring = fingerOpen(lm, 16, 14, 13, scale);
        const pinky = fingerOpen(lm, 20, 18, 17, scale);
        const openCount = [index, middle, ring, pinky].filter(Boolean).length;
        if (openCount >= 4) return "palm";
        if (isPoint(lm, scale) || (index && !middle && !ring && !pinky)) return "point";
        if (openCount === 0 && !index) return "fist";
        return "none";
      }
      async function loadHands() {
        if (landmarker) return landmarker;
        tag.textContent = "loading hands";
        const mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
        const vision = await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        const opts = {
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        };
        try {
          landmarker = await mod.HandLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
              delegate: "GPU"
            },
            ...opts
          });
        } catch (_) {
          landmarker = await mod.HandLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
              delegate: "CPU"
            },
            ...opts
          });
        }
        return landmarker;
      }
      function drawHand(landmarks) {
        const w = overlay.width, h = overlay.height;
        octx.clearRect(0, 0, w, h);
        if (!landmarks) return;
        octx.strokeStyle = "rgba(121,210,255,0.85)";
        octx.fillStyle = "rgba(232,246,255,0.95)";
        octx.lineWidth = 2;
        for (const [a, b] of CONNECTIONS) {
          octx.beginPath();
          octx.moveTo(landmarks[a].x * w, landmarks[a].y * h);
          octx.lineTo(landmarks[b].x * w, landmarks[b].y * h);
          octx.stroke();
        }
        for (const p of landmarks) {
          octx.beginPath();
          octx.arc(p.x * w, p.y * h, 3, 0, Math.PI * 2);
          octx.fill();
        }
      }
      function moveCursor(lm) {
        const nx = 1 - lm[8].x;
        const ny = lm[8].y;
        const tx = nx * innerWidth;
        const ty = ny * innerHeight;
        cursorX += (tx - cursorX) * 0.35;
        cursorY += (ty - cursorY) * 0.35;
        cursorEl.style.left = cursorX + "px";
        cursorEl.style.top = cursorY + "px";
        cursorEl.classList.add("on");
      }
      function clickAtCursor() {
        const now = Date.now();
        if (now - lastClickAt < 450) return;
        lastClickAt = now;
        cursorEl.classList.add("click");
        setTimeout(() => cursorEl.classList.remove("click"), 140);
        const el = document.elementFromPoint(cursorX, cursorY);
        if (!el || el === cursorEl) return;
        const clickable = el.closest("button, a, input, textarea, label, .button, [role='button']") || el;
        clickable.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window, clientX: cursorX, clientY: cursorY }));
        if (clickable.matches && clickable.matches("input, textarea")) clickable.focus();
      }
      function fireCommand(kind) {
        const now = Date.now();
        if (now - lastCommandAt < 1200) return;
        lastCommandAt = now;
        poke();
        if (kind === "palm") flyOut();
        if (kind === "fist") flyIn();
      }
      function setMode(next) {
        if (mode === next) return;
        mode = next;
        enterFrames = 0;
        lastModeAt = Date.now();
        if (next === "palm") fireCommand("palm");
        if (next === "fist") fireCommand("fist");
        if (next !== "point") {
          cursorEl.classList.remove("on", "pinch");
          pinchHeld = false;
          pinchOpen = true;
          pinchFrames = 0;
        }
      }
      function onHand(landmarks) {
        const raw = classify(landmarks);
        const scale = Math.max(dist(landmarks[0], landmarks[9]), 0.08);
        const pinchRatio = dist(landmarks[4], landmarks[8]) / scale;
        const now = Date.now();

        if (raw === mode) {
          enterFrames = 0;
        } else {
          const needed = mode === "none" ? (ENTER[raw] || 6) : (HOLD[mode] || 10);
          if (raw === "none") enterFrames += 1;
          else if (mode === "point" && raw === "fist" && pinchRatio < 0.55) enterFrames += 0;
          else enterFrames += 1;
          if (enterFrames >= needed) setMode(raw);
        }

        if (mode === "point") {
          moveCursor(landmarks);
          if (pinchRatio > 0.58) {
            pinchOpen = true;
            pinchFrames = 0;
            pinchHeld = false;
            cursorEl.classList.remove("pinch");
          } else if (pinchRatio < 0.48) {
            pinchFrames += 1;
          } else {
            pinchFrames = Math.max(0, pinchFrames - 1);
          }
          if (pinchOpen && pinchFrames >= 3 && !pinchHeld) {
            pinchOpen = false;
            pinchHeld = true;
            cursorEl.classList.add("pinch");
            clickAtCursor();
            tag.textContent = "click";
            return;
          }
        }

        tag.textContent = (mode === "none" ? (raw === "none" ? "ready" : raw + "…") : mode);
      }
      async function loop() {
        if (!running || !landmarker) return;
        try {
          if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            overlay.width = video.videoWidth || 320;
            overlay.height = video.videoHeight || 240;
            const result = landmarker.detectForVideo(video, performance.now());
            const hand = result && result.landmarks && result.landmarks[0];
            drawHand(hand);
            if (hand) onHand(hand);
            else {
              tag.textContent = "no hand";
              if (cursorEl) cursorEl.classList.remove("on", "pinch");
              enterFrames += 1;
              if (enterFrames >= 8) setMode("none");
            }
          }
        } catch (err) {
          tag.textContent = "track error";
          console.warn(err);
        }
        requestAnimationFrame(loop);
      }
      async function startHands() {
        try {
          await loadHands();
          camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
          video.srcObject = camStream;
          video.playsInline = true;
          video.muted = true;
          await video.play();
          running = true;
          mode = "none";
          enterFrames = 0;
          preview.classList.add("on");
          tag.textContent = "tracking";
          loop();
        } catch (err) {
          console.warn(err);
          tag.textContent = err && err.name === "NotAllowedError" ? "camera blocked" : "hands failed";
          toggle.checked = false;
        }
      }
      function stopHands() {
        running = false;
        preview.classList.remove("on");
        tag.textContent = "hands off";
        cursorEl.classList.remove("on", "pinch", "click");
        if (camStream) camStream.getTracks().forEach((t) => t.stop());
        camStream = null;
        video.srcObject = null;
        octx.clearRect(0, 0, overlay.width, overlay.height);
      }
      toggle.addEventListener("change", (e) => { e.target.checked ? startHands() : stopHands(); });
    })();
  </script>
</body>
