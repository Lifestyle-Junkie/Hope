      width: var(--progress-width, 0%);

    /* React logo styles */

      pointer-events: none;

      height: 5rem; /* Increased from 4rem to 5rem (80px) */

      .App-logo.spinning {

    /* Progress bar container glow effect */
    .progress-container {
      position: relative;
      --green: #1BFD9C;
      border: 2px solid var(--green);
      background: linear-gradient(to right, rgba(27, 253, 156, 0.1) 1%, transparent 40%, transparent 60%, rgba(27, 253, 156, 0.1) 100%);

      transition: all 0.3s;
    }
    .progress-container:hover {
      box-shadow: inset 0 0 10px rgba(27, 253, 156, 0.6), 0 0 9px 3px rgba(27, 253, 156, 0.2);
    }
    .progress-container::before {
      content: "";
      position: absolute;
      left: -4em;
      width: 4em;
      height: 100%;
      top: 0;
      transition: transform 0.4s ease-in-out;
      background: linear-gradient(to right, transparent 1%, rgba(27, 253, 156, 0.1) 40%, rgba(27, 253, 156, 0.1) 60%, transparent 100%);
    }
    .progress-container:hover::before {
      transform: translateX(calc(100% + 4em));
    }
    /* Percentage box and logo box glow effect */

      position: relative;
      --green: #1BFD9C;

  <script>
    // Make body fade in once DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('ready');
      // Delay progress bar animation to start after fade-in
      setTimeout(() => {
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const logo = document.querySelector('.App-logo');
        const dots = {
          25: document.getElementById('dot-25'),
          50: document.getElementById('dot-50'),
          75: document.getElementById('dot-75'),
          100: document.getElementById('dot-100')
        };
        let progress = 0;
        const duration = 5000; // 5 seconds
        const increment = 100 / (duration / 16); // Approx 60fps (16ms per frame)
        function updateProgress() {
          if (progress < 100) {
            progress = Math.min(progress + increment, 100);
            progressFill.style.setProperty('--progress-width', `${progress}%`);
            progressText.textContent = `${Math.round(progress)}%`;
            logo.classList.add('spinning'); // Keep logo spinning
            // Update milestone dots to green when progress passes their percentage
            for (const [percent, dot] of Object.entries(dots)) {
              if (progress >= parseInt(percent)) {
                dot.classList.remove('bg-slate-700');
                dot.classList.add('bg-gradient-to-r', 'from-teal-400', 'to-emerald-400');
                dot.parentElement.classList.remove('border-slate-700/20');
                dot.parentElement.classList.add('border-teal-500/20');
                dot.parentElement.nextElementSibling.classList.remove('text-slate-600');
                dot.parentElement.nextElementSibling.classList.add('text-teal-400');
              }
            }
            requestAnimationFrame(updateProgress);
          } else {
            progressFill.style.setProperty('--progress-width', '100%');
            progressText.textContent = '100%';
            logo.classList.remove('spinning'); // Stop logo spinning
            // Ensure 100% dot is green
            dots[100].classList.remove('bg-slate-700');
            dots[100].classList.add('bg-gradient-to-r', 'from-teal-400', 'to-emerald-400');
            dots[100].parentElement.classList.remove('border-slate-700/20');
            dots[100].parentElement.classList.add('border-teal-500/20');
            dots[100].parentElement.nextElementSibling.classList.remove('text-slate-600');
            dots[100].parentElement.nextElementSibling.classList.add('bg-gradient-to-r', 'from-teal-400', 'to-emerald-400', 'text-transparent', 'bg-clip-text', 'drop-shadow-[0_2px_2px_rgba(20,184,166,0.5)]');
            // Fade out and redirect to htmlUI.html after 1-second pause
            setTimeout(() => {
              document.body.classList.add('fade-out');
              setTimeout(() => {
                window.location.href = 'index.html';
              }, 800); // Match fade-out duration
            }, 1000); // 1-second pause
          }
        }
        // Start animation
        requestAnimationFrame(updateProgress);
      }, 600); // Delay matches fade-in duration
    });
  </script>
